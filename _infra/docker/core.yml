name: studybook_core

services:
  postgres:
    image: postgres:16
    container_name: de_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-de_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-de_telemetry}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - de_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-de_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [studybook_net]

  redis:
    image: redis:7-alpine
    container_name: de_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-change_me} --appendonly yes
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - de_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change_me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [studybook_net]

  cassandra:
    image: cassandra:4.1
    container_name: de_cassandra
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: de_cluster
      CASSANDRA_DC: dc1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      HEAP_NEWSIZE: 128M
      MAX_HEAP_SIZE: 1G
    ports:
      - "${CASSANDRA_PORT:-9042}:9042"
    volumes:
      - de_cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep UN"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 60s
    networks: [studybook_net]

  neo4j:
    image: neo4j:5
    container_name: de_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-change_me}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - de_neo4j_data:/data
      - de_neo4j_logs:/logs
      - de_neo4j_import:/var/lib/neo4j/import
      - de_neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [studybook_net]

  influxdb:
    image: influxdb:2.7
    container_name: de_influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USER:-de_admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-change_me}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-de_org}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-telemetry}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-change_me}
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    volumes:
      - de_influxdb_data:/var/lib/influxdb2
      - de_influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [studybook_net]

networks:
  studybook_net:
    name: studybook_net
    driver: bridge

volumes:
  de_postgres_data:
    name: de_postgres_data
  de_redis_data:
    name: de_redis_data
  de_cassandra_data:
    name: de_cassandra_data
  de_neo4j_data:
    name: de_neo4j_data
  de_neo4j_logs:
    name: de_neo4j_logs
  de_neo4j_import:
    name: de_neo4j_import
  de_neo4j_plugins:
    name: de_neo4j_plugins
  de_influxdb_data:
    name: de_influxdb_data
  de_influxdb_config:
    name: de_influxdb_config