name: studybook_infra

services:
  postgres:
    image: postgres:16
    container_name: de_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-de_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-de_telemetry}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - de_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-de_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [studybook_net]

  redis:
    image: redis:7-alpine
    container_name: de_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-change_me} --appendonly yes
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - de_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change_me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [studybook_net]

  cassandra:
    image: cassandra:4.1
    container_name: de_cassandra
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: de_cluster
      CASSANDRA_DC: dc1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      HEAP_NEWSIZE: 128M
      MAX_HEAP_SIZE: 1G
    ports:
      - "${CASSANDRA_PORT:-9042}:9042"
    volumes:
      - de_cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep UN"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 60s
    networks: [studybook_net]

  neo4j:
    image: neo4j:5
    container_name: de_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-change_me}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - de_neo4j_data:/data
      - de_neo4j_logs:/logs
      - de_neo4j_import:/var/lib/neo4j/import
      - de_neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [studybook_net]

  influxdb:
    image: influxdb:2.7
    container_name: de_influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USER:-de_admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-change_me}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-de_org}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-telemetry}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-change_me}
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    volumes:
      - de_influxdb_data:/var/lib/influxdb2
      - de_influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [studybook_net]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: citi_zookeeper
    restart: unless-stopped
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "cub zk-ready localhost:2181 10"]
      interval: 10s
      timeout: 15s
      retries: 5
    networks: [studybook_net]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: citi_kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "${KAFKA_INTERNAL_PORT:-29092}:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:${KAFKA_INTERNAL_PORT:-29092},PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - citi_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks: [studybook_net]

  kafka_ui:
    image: provectuslabs/kafka-ui:latest
    container_name: citi_kafka_ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_started
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:${KAFKA_INTERNAL_PORT:-29092}
    networks: [studybook_net]

  spark:
    image: apache/spark:3.5.3
    container_name: citi_spark
    restart: unless-stopped
    ports:
      - "${SPARK_MASTER_UI_PORT:-8081}:8080"
      - "${SPARK_MASTER_PORT:-7077}:7077"
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    hostname: spark
    environment:
      SPARK_MASTER_HOST: spark
    volumes:
      - citi_spark_master_work:/opt/spark/work
      - spark_extra_jars:/opt/spark/extra-jars:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [studybook_net]

  spark_worker:
    image: apache/spark:3.5.3
    container_name: citi_spark_worker
    user: root
    restart: unless-stopped
    depends_on:
      - spark
    command: >
      bash -c "chown -R spark:spark /opt/spark/work &&
      su spark -c '/opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark:7077'"
    environment:
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "2g"
      SPARK_WORKER_WEBUI_PORT: "8085"
    ports:
      - "${SPARK_WORKER_UI_PORT:-8085}:8085"
    volumes:
      - citi_spark_worker_work:/opt/spark/work
      - spark_extra_jars:/opt/spark/extra-jars:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [studybook_net]

  airflow:
    image: apache/airflow:2.8.0
    container_name: citi_airflow
    restart: unless-stopped
    ports:
      - "${AIRFLOW_PORT:-8082}:8080"
    command: standalone
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${POSTGRES_USER:-de_admin}:${POSTGRES_PASSWORD:-change_me}@host.docker.internal:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-de_telemetry}"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USER:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-airflow}
    volumes:
      - citi_airflow_dags:/opt/airflow/dags
      - citi_airflow_logs:/opt/airflow/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [studybook_net]

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: citi_mlflow
    restart: unless-stopped
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes:
      - citi_mlflow_artifacts:/mlflow/artifacts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [studybook_net]

  elasticsearch:
    image: elasticsearch:8.12.0
    container_name: de_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-change_me}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx1g
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "${ELASTIC_PORT:-9200}:9200"
    volumes:
      - de_elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ELASTIC_PASSWORD:-change_me} http://localhost:9200/_cluster/health | grep -v red"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [studybook_net]

  kibana:
    image: kibana:8.12.0
    container_name: de_kibana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD:-change_me}
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    volumes:
      - de_kibana_data:/usr/share/kibana/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -v red"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks: [studybook_net]

  splunk:
    image: splunk/splunk:9.2.0
    container_name: citi_splunk
    restart: unless-stopped
    ports:
      - "${SPLUNK_PORT_WEB:-8000}:8000"
      - "${SPLUNK_PORT_HEC:-8088}:8088"
      - "${SPLUNK_PORT_MGT:-8089}:8089"
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:-change_me}
    volumes:
      - splunk_var:/opt/splunk/var
      - splunk_etc:/opt/splunk/etc
    healthcheck:
      test: ["CMD", "curl", "-sk", "https://localhost:8089/services/server/info", "-u", "admin:${SPLUNK_PASSWORD:-change_me}", "-o", "/dev/null", "-w", "%{http_code}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks: [studybook_net]

networks:
  studybook_net:
    name: studybook_net
    driver: bridge

volumes:
  de_postgres_data:
    name: de_postgres_data
  de_redis_data:
    name: de_redis_data
  de_cassandra_data:
    name: de_cassandra_data
  de_neo4j_data:
    name: de_neo4j_data
  de_neo4j_logs:
    name: de_neo4j_logs
  de_neo4j_import:
    name: de_neo4j_import
  de_neo4j_plugins:
    name: de_neo4j_plugins
  de_influxdb_data:
    name: de_influxdb_data
  de_influxdb_config:
    name: de_influxdb_config
  citi_kafka_data:
    name: citi_kafka_data
  citi_spark_master_work:
    name: citi_spark_master_work
  citi_spark_worker_work:
    name: citi_spark_worker_work
  spark_extra_jars:
    name: spark_extra_jars
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${SPARK_JARS_HOST_PATH:-C:/Users/shareuser/.ivy2/jars}"
  citi_airflow_dags:
    name: citi_airflow_dags
  citi_airflow_logs:
    name: citi_airflow_logs
  citi_mlflow_artifacts:
    name: citi_mlflow_artifacts
  de_elasticsearch_data:
    name: de_elasticsearch_data
  de_kibana_data:
    name: de_kibana_data
  splunk_var:
    name: splunk_var
  splunk_etc:
    name: splunk_etc