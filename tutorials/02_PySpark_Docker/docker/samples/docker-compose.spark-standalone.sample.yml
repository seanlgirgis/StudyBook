version: "3.9"

services:
  spark-master:
    image: apache/spark:3.5.3
    container_name: citi_spark
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master
      --port 7077
      --webui-port 8080
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "7077:7077"
      - "8081:8080"
    networks:
      - spark-net

  spark-worker:
    image: apache/spark:3.5.3
    container_name: citi_spark_worker
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "2g"
    ports:
      - "8085:8081"
    networks:
      - spark-net

networks:
  spark-net:
    driver: bridge
