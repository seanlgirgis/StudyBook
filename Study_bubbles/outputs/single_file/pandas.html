<!doctype html>
<html lang="en">
<head>
  <!-- SECTION: Metadata -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pandas Study Map</title>

  <!-- SECTION: Styles -->
  <style>
:root {
  color-scheme: dark;
  --bg: #111827;
  --panel: #1f2937;
  --panel-2: #111827;
  --text: #e5e7eb;
  --muted: #9ca3af;
  --line: #374151;
  --accent: #60a5fa;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Segoe UI", Tahoma, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.app-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  background: #0b1220;
}

.header-top h1 {
  margin: 0;
  font-size: 1.35rem;
}

.header-top p {
  margin: 6px 0 0;
  color: var(--muted);
}

.topic-parent-nav {
  margin-top: 10px;
}

.toolbar {
  margin-top: 10px;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

#search-input {
  min-width: 250px;
  flex: 1 1 320px;
  background: #111827;
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 10px;
}

#search-input:focus {
  outline: none;
  border-color: var(--accent);
}

.search-count {
  font-size: 12px;
  color: var(--muted);
  min-width: 64px;
}

.group-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.filter-btn,
.clear-btn {
  border: 1px solid var(--line);
  background: #111827;
  color: var(--text);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 12px;
  cursor: pointer;
}

.nav-topic-btn {
  border: 1px solid var(--line);
  background: #111827;
  color: var(--text);
  border-radius: 8px;
  padding: 7px 12px;
  font-size: 12px;
  cursor: pointer;
}

.nav-topic-btn:hover {
  border-color: var(--accent);
}

.parent-topic-btn {
  background: rgba(96, 165, 250, 0.15);
  border-color: var(--accent);
  color: #dbeafe;
}

.filter-btn.is-active {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(96, 165, 250, 0.12);
}

.clear-btn:hover,
.filter-btn:hover {
  border-color: var(--accent);
}

.layout {
  display: grid;
  grid-template-columns: 2fr 1fr;
  min-height: calc(100vh - 130px);
}

.map-area {
  border-right: 1px solid var(--line);
  padding: 10px;
}

#map-svg {
  width: 100%;
  height: 100%;
  min-height: 420px;
  background: radial-gradient(circle at top, #1f2937, #111827 70%);
  border-radius: 10px;
}

.side-panel {
  padding: 16px;
  background: var(--panel);
}

.side-panel h2 {
  margin: 0 0 10px;
  font-size: 1rem;
}

.panel-card {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 18px;
}

.panel-card p {
  margin: 0 0 10px;
  line-height: 1.35;
}

.nav-section {
  margin: 10px 0;
}

.nav-button-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.path-list {
  margin: 0;
  padding-left: 18px;
}

.path-list li {
  margin-bottom: 8px;
}

.link-line {
  stroke: #6b7280;
  stroke-width: 3;
}

.bubble-node {
  cursor: pointer;
  transition: opacity 0.15s ease;
}

.bubble-circle {
  fill: #2563eb;
  stroke: #dbeafe;
  stroke-width: 2;
}

.bubble-node.is-active .bubble-circle {
  fill: #1d4ed8;
  stroke: #f8fafc;
  stroke-width: 3;
}

.bubble-label {
  fill: #f9fafb;
  font-size: 16px;
  font-weight: 600;
  text-anchor: middle;
  dominant-baseline: middle;
  pointer-events: none;
}

@media (max-width: 900px) {
  .layout {
    grid-template-columns: 1fr;
  }

  .map-area {
    border-right: none;
    border-bottom: 1px solid var(--line);
  }

  .toolbar {
    align-items: stretch;
  }
}

  </style>
</head>
<body>
  <!-- SECTION: App Shell -->
  <header class="app-header">
    <div class="header-top">
      <h1 id="topic-title">Loading topic...</h1>
      <p id="topic-subtitle"></p>
    </div>
    <div class="toolbar">
      <input id="search-input" type="text" placeholder="Search label, definition, safe sentence..." autocomplete="off" />
      <span id="search-count" class="search-count"></span>
      <div id="group-filters" class="group-filters"></div>
      <button id="clear-filters" class="clear-btn" type="button">Reset</button>
    </div>
  </header>

  <main class="layout">
    <section class="map-area">
      <svg id="map-svg" viewBox="0 0 1000 520" role="img" aria-label="Study bubble map"></svg>
    </section>

    <aside class="side-panel">
      <h2>Details</h2>
      <div id="node-details" class="panel-card">
        <p>Select a bubble to view details.</p>
      </div>

      <h2>Study Paths</h2>
      <ul id="study-paths" class="path-list"></ul>
    </aside>
  </main>

  <!-- SECTION: JavaScript -->
  <script>
(async function initViewer() {
  const titleEl = document.getElementById("topic-title");
  const subtitleEl = document.getElementById("topic-subtitle");
  const svg = document.getElementById("map-svg");
  const detailsEl = document.getElementById("node-details");
  const pathsEl = document.getElementById("study-paths");
  const searchInput = document.getElementById("search-input");
  const searchCountEl = document.getElementById("search-count");
  const groupFiltersEl = document.getElementById("group-filters");
  const clearBtn = document.getElementById("clear-filters");
  const headerTopEl = document.querySelector(".header-top");

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#39;");
  }

  function toSingleFileHref(topicRef) {
    if (!topicRef) return "#";
    return String(topicRef).replace(/\.studybubble\.json$/i, ".html");
  }

  function toMultifileHref(topicRef) {
    if (!topicRef) return "#";
    const fileName = String(topicRef).split(/[\\/]/).pop() || "";
    const topicId = fileName.replace(/\.studybubble\.json$/i, "");
    return `../${topicId}/index.html`;
  }

  function topicRefToHref(topicRef, mode) {
    if (mode === "single-file") return toSingleFileHref(topicRef);
    return toMultifileHref(topicRef);
  }

  function topicJsonToHtmlName(topicRef) {
    if (!topicRef) return "";
    return String(topicRef)
      .split(/[\\/]/)
      .pop()
      .replace(/\.studybubble\.json$/i, ".html");
  }

  function navigateToTopicRef(topicRef, mode) {
    const href = topicRefToHref(topicRef, mode);
    if (!href || href === "#") return;
    window.location.href = href;
  }

  function defaultOpenLabel(topicRef) {
    const htmlName = topicJsonToHtmlName(topicRef);
    const base = htmlName.replace(/\.html$/i, "").replaceAll("_", " ");
    return `Open ${base || "Child Topic"}`;
  }

  function renderExternalLinks(links) {
    if (!Array.isArray(links) || links.length === 0) return "";
    const items = links
      .map(
        (link) =>
          `<li><a href="${escapeHtml(link.href || "#")}" target="_blank" rel="noopener noreferrer">${escapeHtml(link.label || "Link")}</a></li>`
      )
      .join("");
    return `<p><strong>External Links:</strong></p><ul>${items}</ul>`;
  }

  function renderChildTopics(childTopics, mode) {
    if (!Array.isArray(childTopics) || childTopics.length === 0) return "";
    const items = childTopics
      .map((child) => {
        const href = topicRefToHref(child.topic, mode);
        return `<li><a href="${escapeHtml(href)}">${escapeHtml(child.label || child.topic || "Child Topic")}</a></li>`;
      })
      .join("");
    return `<p><strong>Child Topics:</strong></p><ul>${items}</ul>`;
  }

  function renderChildTopicButtons(childTopics, mode) {
    if (!Array.isArray(childTopics) || childTopics.length === 0) return "";
    const buttons = childTopics
      .map((child) => {
        const href = topicRefToHref(child.topic, mode);
        if (!href || href === "#") return "";
        const text = child.label ? child.label : defaultOpenLabel(child.topic);
        return `<button type="button" class="nav-topic-btn child-topic-btn" data-nav-href="${escapeHtml(href)}">${escapeHtml(text)}</button>`;
      })
      .filter(Boolean)
      .join("");
    if (!buttons) return "";
    return `<div class="nav-section"><p><strong>Child Topic Navigation:</strong></p><div class="nav-button-row">${buttons}</div></div>`;
  }

  function renderParentTopic(parentTopic, mode) {
    if (!parentTopic || typeof parentTopic !== "object") return "";
    const href = topicRefToHref(parentTopic.topic, mode);
    return `<p><strong>Parent Topic:</strong> <a href="${escapeHtml(href)}">${escapeHtml(parentTopic.label || "Back")}</a></p>`;
  }

  function renderTopicParentButton(topic, mode) {
    if (!headerTopEl) return;
    const existing = document.getElementById("topic-parent-nav");
    if (existing) existing.remove();
    const parentTopic = topic && topic.parentTopic && typeof topic.parentTopic === "object"
      ? topic.parentTopic
      : null;
    if (!parentTopic || !parentTopic.topic) return;
    const href = topicRefToHref(parentTopic.topic, mode);
    if (!href || href === "#") return;

    const wrap = document.createElement("div");
    wrap.id = "topic-parent-nav";
    wrap.className = "topic-parent-nav";
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "nav-topic-btn parent-topic-btn";
    btn.textContent = parentTopic.label || "Back";
    btn.addEventListener("click", () => {
      navigateToTopicRef(parentTopic.topic, mode);
    });
    wrap.appendChild(btn);
    headerTopEl.appendChild(wrap);
  }

  function nodeSearchText(node) {
    return [
      node.label,
      node.definition,
      node.whyItMatters,
      node.safeSentence,
      node.note && node.note.summary,
    ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();
  }

  let currentTopic = null;
  let currentMode = "multifile";
  let activeFilter = "All";
  let searchTerm = "";
  let selectedNodeId = null;
  const nodeElements = new Map();
  const linkElements = [];

  function renderDetails(node, topic, mode) {
    const noteSummary = node.note && node.note.summary ? node.note.summary : "N/A";
    const hasOneChildTopic = Array.isArray(node.childTopics) && node.childTopics.length === 1;
    const hasParentTopic = !!(topic && topic.parentTopic && topic.parentTopic.topic);
    const doubleClickHint = hasOneChildTopic
      ? `<p><em>Double-click this bubble to open: ${escapeHtml(node.childTopics[0].label || node.childTopics[0].topic || "Child Topic")}</em></p>`
      : hasParentTopic
      ? `<p><em>Double-click this bubble to go back to parent topic: ${escapeHtml(topic.parentTopic.label || topic.parentTopic.topic || "Back")}</em></p>`
      : "";
    detailsEl.innerHTML = `
      <p><strong>Label:</strong> ${escapeHtml(node.label)}</p>
      <p><strong>Group:</strong> ${escapeHtml(node.group)}</p>
      <p><strong>Definition:</strong> ${escapeHtml(node.definition)}</p>
      <p><strong>Why It Matters:</strong> ${escapeHtml(node.whyItMatters || "")}</p>
      <p><strong>Safe Sentence:</strong> ${escapeHtml(node.safeSentence || "")}</p>
      <p><strong>Note:</strong> ${escapeHtml(noteSummary)}</p>
      ${doubleClickHint}
      ${renderExternalLinks(node.externalLinks)}
      ${renderChildTopicButtons(node.childTopics, mode)}
      ${renderChildTopics(node.childTopics, mode)}
      ${renderParentTopic(topic.parentTopic, mode)}
    `;

    for (const button of detailsEl.querySelectorAll(".nav-topic-btn[data-nav-href]")) {
      button.addEventListener("click", () => {
        const href = button.getAttribute("data-nav-href");
        if (!href || href === "#") return;
        window.location.href = href;
      });
    }
  }

  function renderPaths(paths) {
    pathsEl.innerHTML = "";
    if (!paths || paths.length === 0) {
      const li = document.createElement("li");
      li.textContent = "No study paths.";
      pathsEl.appendChild(li);
      return;
    }

    for (const path of paths) {
      const li = document.createElement("li");
      li.innerHTML = `<strong>${escapeHtml(path.label)}</strong><br>${escapeHtml(path.description || "")}`;
      pathsEl.appendChild(li);
    }
  }

  function setSelectedNode(nodeId) {
    selectedNodeId = nodeId;
    for (const [id, el] of nodeElements.entries()) {
      if (id === nodeId) {
        el.group.classList.add("is-active");
      } else {
        el.group.classList.remove("is-active");
      }
    }
    const node = (currentTopic.nodes || []).find((n) => n.id === nodeId);
    if (node) renderDetails(node, currentTopic, currentMode);
  }

  function shouldNodeBeVisible(node) {
    const groupMatch = activeFilter === "All" || node.group === activeFilter;
    if (!groupMatch) return false;

    if (!searchTerm.trim()) return true;
    return nodeSearchText(node).includes(searchTerm.trim().toLowerCase());
  }

  function applyVisibility() {
    if (!currentTopic) return;

    const visibleNodeIds = new Set();
    let matchCount = 0;

    for (const node of currentTopic.nodes || []) {
      const visible = shouldNodeBeVisible(node);
      const nodeEl = nodeElements.get(node.id);
      if (!nodeEl) continue;

      if (visible) {
        nodeEl.group.style.opacity = "1";
        visibleNodeIds.add(node.id);
        if (searchTerm.trim()) matchCount += 1;
      } else {
        nodeEl.group.style.opacity = "0.15";
      }
    }

    for (const linkEl of linkElements) {
      const srcVisible = visibleNodeIds.has(linkEl.sourceId);
      const tgtVisible = visibleNodeIds.has(linkEl.targetId);
      linkEl.el.style.opacity = srcVisible && tgtVisible ? "0.85" : "0.1";
    }

    if (searchCountEl) {
      if (searchTerm.trim()) {
        searchCountEl.textContent = `${matchCount} match${matchCount === 1 ? "" : "es"}`;
      } else {
        searchCountEl.textContent = "";
      }
    }

    if (selectedNodeId && !visibleNodeIds.has(selectedNodeId)) {
      selectedNodeId = null;
      detailsEl.innerHTML = "<p>Select a visible bubble to view details.</p>";
      for (const [, el] of nodeElements.entries()) {
        el.group.classList.remove("is-active");
      }
    }
  }

  function renderGroupFilters(topic) {
    if (!groupFiltersEl) return;
    groupFiltersEl.innerHTML = "";
    const groups = ["All", ...((topic.groups || []).map((g) => g.label).filter(Boolean))];

    for (const groupName of groups) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "filter-btn";
      btn.textContent = groupName;
      if (groupName === activeFilter) btn.classList.add("is-active");
      btn.addEventListener("click", () => {
        activeFilter = groupName;
        for (const b of groupFiltersEl.querySelectorAll(".filter-btn")) {
          b.classList.toggle("is-active", b.textContent === groupName);
        }
        applyVisibility();
      });
      groupFiltersEl.appendChild(btn);
    }
  }

  function drawTopic(topic, mode) {
    currentTopic = topic;
    currentMode = mode;
    activeFilter = "All";
    searchTerm = "";
    selectedNodeId = null;
    if (searchInput) searchInput.value = "";
    if (searchCountEl) searchCountEl.textContent = "";

    titleEl.textContent = topic.title || "StudyBubble Topic";
    subtitleEl.textContent = topic.subtitle || "";
    renderTopicParentButton(topic, mode);

    svg.innerHTML = "";
    nodeElements.clear();
    linkElements.length = 0;

    const nodes = Array.isArray(topic.nodes) ? topic.nodes : [];
    const links = Array.isArray(topic.links) ? topic.links : [];
    const nodeById = new Map(nodes.map((n) => [n.id, n]));

    const width = 1000;
    const y = 260;
    const margin = 100;
    const step = nodes.length > 1 ? (width - margin * 2) / (nodes.length - 1) : 0;

    const positioned = nodes.map((node, i) => ({
      ...node,
      x: margin + step * i,
      y,
      r: node.size === "detail" ? 40 : node.size === "support" ? 48 : 56,
    }));

    const positionById = new Map(positioned.map((n) => [n.id, n]));

    for (const link of links) {
      const source = positionById.get(link.source);
      const target = positionById.get(link.target);
      if (!source || !target) continue;

      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("class", "link-line");
      line.setAttribute("x1", String(source.x));
      line.setAttribute("y1", String(source.y));
      line.setAttribute("x2", String(target.x));
      line.setAttribute("y2", String(target.y));
      svg.appendChild(line);
      linkElements.push({ el: line, sourceId: link.source, targetId: link.target });
    }

    for (const node of positioned) {
      const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
      group.setAttribute("class", "bubble-node");
      group.setAttribute("tabindex", "0");

      const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      circle.setAttribute("class", "bubble-circle");
      circle.setAttribute("cx", String(node.x));
      circle.setAttribute("cy", String(node.y));
      circle.setAttribute("r", String(node.r));

      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("class", "bubble-label");
      text.setAttribute("x", String(node.x));
      text.setAttribute("y", String(node.y));
      text.textContent = node.label;

      group.appendChild(circle);
      group.appendChild(text);

      function activate() {
        setSelectedNode(node.id);
      }

      function navigateToSingleChildTopic() {
        const childTopics = Array.isArray(node.childTopics) ? node.childTopics : [];
        if (childTopics.length !== 1) return;
        navigateToTopicRef(childTopics[0].topic, mode);
      }

      function navigateToParentTopic() {
        const parentTopic = topic && topic.parentTopic && typeof topic.parentTopic === "object"
          ? topic.parentTopic
          : null;
        if (!parentTopic || !parentTopic.topic) return;
        navigateToTopicRef(parentTopic.topic, mode);
      }

      group.addEventListener("click", activate);
      group.addEventListener("dblclick", () => {
        activate();
        const childTopics = Array.isArray(node.childTopics) ? node.childTopics : [];
        if (childTopics.length === 1) {
          navigateToSingleChildTopic();
          return;
        }
        navigateToParentTopic();
      });
      group.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          activate();
        }
      });

      const childTopics = Array.isArray(node.childTopics) ? node.childTopics : [];
      if (childTopics.length === 1) {
        const childLabel = childTopics[0].label || childTopics[0].topic || "child topic";
        group.setAttribute("title", `Double-click to open ${childLabel}`);
      } else if (topic.parentTopic && topic.parentTopic.topic) {
        const parentLabel = topic.parentTopic.label || topic.parentTopic.topic || "parent topic";
        group.setAttribute("title", `Double-click to go back to ${parentLabel}`);
      }

      svg.appendChild(group);
      nodeElements.set(node.id, { group, node });
    }

    renderGroupFilters(topic);
    renderPaths(topic.paths || []);

    if (nodes.length > 0) {
      setSelectedNode(nodes[0].id);
    }

    applyVisibility();
  }

  async function loadTopic() {
    const embedded = document.getElementById("studybubble-topic-data");
    if (embedded) {
      return JSON.parse(embedded.textContent || "{}");
    }
    const response = await fetch("topic.studybubble.json");
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }
    return response.json();
  }

  if (searchInput) {
    searchInput.addEventListener("input", () => {
      searchTerm = searchInput.value || "";
      applyVisibility();
    });
  }

  if (clearBtn) {
    clearBtn.addEventListener("click", () => {
      searchTerm = "";
      if (searchInput) searchInput.value = "";
      activeFilter = "All";
      selectedNodeId = null;

      if (groupFiltersEl) {
