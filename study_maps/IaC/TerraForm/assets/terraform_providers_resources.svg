<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820">
  <rect width="1500" height="820" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f3b52"/>
    </marker>
    <style>
      .box { fill:#f8fafc; stroke:#2f3b52; stroke-width:2; rx:8; ry:8; }
      .accent { fill:#ecfeff; stroke:#0e7490; }
      .txt { font-family:Segoe UI, Arial, sans-serif; font-size:20px; fill:#111827; text-anchor:middle; dominant-baseline:middle; }
      .small { font-size:17px; }
      .line { stroke:#2f3b52; stroke-width:2.4; fill:none; marker-end:url(#arrow); }
      .title { font-family:Segoe UI, Arial, sans-serif; font-size:31px; font-weight:600; fill:#111827; }
    </style>
  </defs>

  <text x="750" y="46" class="title">Terraform Providers and Resources</text>

  <rect class="box" x="100" y="130" width="280" height="70"/><text class="txt" x="240" y="165">Terraform configuration</text>
  <rect class="box" x="450" y="130" width="230" height="70"/><text class="txt" x="565" y="165">provider block</text>
  <rect class="box accent" x="740" y="130" width="260" height="70"/><text class="txt" x="870" y="165">AWS provider/plugin</text>
  <rect class="box" x="1060" y="130" width="190" height="70"/><text class="txt" x="1155" y="165">AWS API</text>
  <rect class="box" x="1300" y="130" width="170" height="70"/><text class="txt small" x="1385" y="165">real resources</text>

  <rect class="box" x="360" y="340" width="220" height="70"/><text class="txt" x="470" y="375">resource block</text>
  <rect class="box" x="650" y="300" width="250" height="70"/><text class="txt small" x="775" y="335">resource type + local name</text>
  <rect class="box" x="650" y="390" width="220" height="70"/><text class="txt small" x="760" y="425">resource address</text>
  <rect class="box" x="960" y="350" width="260" height="70"/><text class="txt small" x="1090" y="385">attributes used by others</text>

  <path class="line" d="M380 165 L450 165"/>
  <path class="line" d="M680 165 L740 165"/>
  <path class="line" d="M1000 165 L1060 165"/>
  <path class="line" d="M1250 165 L1300 165"/>

  <path class="line" d="M565 200 L470 340"/>
  <path class="line" d="M580 375 L650 335"/>
  <path class="line" d="M775 370 L760 390"/>
  <path class="line" d="M870 425 L960 385"/>
</svg>
