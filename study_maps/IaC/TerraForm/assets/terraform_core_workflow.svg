<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780">
  <rect width="1500" height="780" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f3b52"/>
    </marker>
    <style>
      .box { fill:#f8fafc; stroke:#2f3b52; stroke-width:2; rx:8; ry:8; }
      .txt { font-family:Segoe UI, Arial, sans-serif; font-size:22px; fill:#1f2937; text-anchor:middle; dominant-baseline:middle; }
      .small { font-size:18px; }
      .line { stroke:#2f3b52; stroke-width:2.4; fill:none; marker-end:url(#arrow); }
      .title { font-family:Segoe UI, Arial, sans-serif; font-size:32px; font-weight:600; fill:#111827; }
      .warn { fill:#fff7ed; stroke:#9a3412; }
    </style>
  </defs>

  <text x="750" y="48" class="title">Terraform Core Workflow</text>

  <rect class="box" x="70" y="140" width="170" height="64"/><text class="txt" x="155" y="172">.tf files</text>
  <rect class="box" x="280" y="140" width="190" height="64"/><text class="txt" x="375" y="172">terraform init</text>
  <rect class="box" x="510" y="140" width="180" height="64"/><text class="txt" x="600" y="172">terraform fmt</text>
  <rect class="box" x="730" y="140" width="220" height="64"/><text class="txt small" x="840" y="172">terraform validate</text>
  <rect class="box" x="990" y="140" width="190" height="64"/><text class="txt" x="1085" y="172">terraform plan</text>
  <rect class="box" x="1220" y="140" width="180" height="64"/><text class="txt small" x="1310" y="172">human review</text>

  <rect class="box" x="1110" y="300" width="200" height="64"/><text class="txt" x="1210" y="332">terraform apply</text>
  <rect class="box" x="1110" y="450" width="220" height="64"/><text class="txt small" x="1220" y="482">outputs + state</text>

  <rect class="box warn" x="820" y="450" width="240" height="64"/><text class="txt small" x="940" y="482">destroy carefully</text>

  <path class="line" d="M240 172 L280 172"/>
  <path class="line" d="M470 172 L510 172"/>
  <path class="line" d="M690 172 L730 172"/>
  <path class="line" d="M950 172 L990 172"/>
  <path class="line" d="M1180 172 L1220 172"/>
  <path class="line" d="M1310 204 L1210 300"/>
  <path class="line" d="M1210 364 L1220 450"/>
  <path class="line" d="M1100 482 L1060 482"/>
</svg>
