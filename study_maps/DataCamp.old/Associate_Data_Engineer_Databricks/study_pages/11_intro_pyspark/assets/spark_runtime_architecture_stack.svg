<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .layer { rx: 16; ry: 16; stroke-width: 2; }
      .h { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .t { font: 14px 'Segoe UI', Arial, sans-serif; fill: #1f2937; }
    </style>
  </defs>
  <rect width="1100" height="900" fill="#f8fafc"/>
  <text x="550" y="48" text-anchor="middle" class="title">Spark Runtime Architecture Stack</text>

  <rect x="160" y="90" width="780" height="105" class="layer" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="190" y="125" class="h">Orchestration</text>
  <text x="190" y="154" class="t">Airflow, Databricks Workflows, Control-M, Autosys, Step Functions</text>

  <rect x="160" y="210" width="780" height="105" class="layer" fill="#dcfce7" stroke="#22c55e"/>
  <text x="190" y="245" class="h">Submission / Job Layer</text>
  <text x="190" y="274" class="t">spark-submit, Databricks Job, EMR Step, Glue Job, K8s SparkApplication</text>

  <rect x="160" y="330" width="780" height="130" class="layer" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="190" y="365" class="h">Spark Runtime</text>
  <text x="190" y="394" class="t">SparkSession / SparkContext, Driver, Executors, Tasks, Partitions</text>
  <text x="190" y="419" class="t">Catalyst planning, Stages, Shuffle</text>

  <rect x="160" y="475" width="780" height="105" class="layer" fill="#fee2e2" stroke="#ef4444"/>
  <text x="190" y="510" class="h">Cluster / Resource Manager</text>
  <text x="190" y="539" class="t">YARN, Kubernetes, Spark Standalone, Databricks/EMR/Glue managed runtimes</text>

  <rect x="160" y="595" width="780" height="105" class="layer" fill="#e0f2fe" stroke="#0ea5e9"/>
  <text x="190" y="630" class="h">Storage</text>
  <text x="190" y="659" class="t">HDFS, S3, ADLS, GCS, Parquet, Delta Lake, JDBC sources, Kafka</text>

  <rect x="160" y="715" width="780" height="105" class="layer" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="190" y="750" class="h">Catalog / Metadata</text>
  <text x="190" y="779" class="t">Hive Metastore, Glue Data Catalog, Unity Catalog</text>
</svg>
