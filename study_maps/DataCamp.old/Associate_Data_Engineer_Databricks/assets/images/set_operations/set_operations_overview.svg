<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Set Operations Overview</title>
  <desc id="desc">Overview of UNION, UNION ALL, INTERSECT, and EXCEPT.</desc>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="600" y="58" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#0f172a">Set Operations Overview</text>

  <g transform="translate(110,120)">
    <text x="180" y="0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">UNION</text>
    <circle cx="145" cy="120" r="85" fill="#22c55e" fill-opacity="0.65" stroke="#166534" stroke-width="3"/>
    <circle cx="220" cy="120" r="85" fill="#22c55e" fill-opacity="0.65" stroke="#166534" stroke-width="3"/>
  </g>

  <g transform="translate(640,120)">
    <text x="180" y="0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">UNION ALL</text>
    <circle cx="145" cy="120" r="85" fill="#22c55e" fill-opacity="0.65" stroke="#166534" stroke-width="3"/>
    <circle cx="220" cy="120" r="85" fill="#22c55e" fill-opacity="0.65" stroke="#166534" stroke-width="3"/>
    <text x="180" y="230" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#14532d">duplicates kept</text>
  </g>

  <g transform="translate(110,420)">
    <text x="180" y="0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">INTERSECT</text>
    <circle cx="145" cy="120" r="85" fill="#93c5fd" fill-opacity="0.35" stroke="#1e3a8a" stroke-width="3"/>
    <circle cx="220" cy="120" r="85" fill="#fdba74" fill-opacity="0.35" stroke="#9a3412" stroke-width="3"/>
    <clipPath id="ovInt"><circle cx="220" cy="120" r="85"/></clipPath>
    <circle cx="145" cy="120" r="85" fill="#22c55e" fill-opacity="0.9" clip-path="url(#ovInt)"/>
  </g>

  <g transform="translate(640,420)">
    <text x="180" y="0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">EXCEPT</text>
    <circle cx="145" cy="120" r="85" fill="#22c55e" fill-opacity="0.75" stroke="#166534" stroke-width="3"/>
    <circle cx="220" cy="120" r="85" fill="#fdba74" fill-opacity="0.30" stroke="#9a3412" stroke-width="3"/>
    <clipPath id="ovExc"><circle cx="220" cy="120" r="85"/></clipPath>
    <circle cx="145" cy="120" r="85" fill="#f8fafc" clip-path="url(#ovExc)"/>
  </g>
</svg>
