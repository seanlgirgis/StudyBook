<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .b { rx: 14; ry: 14; stroke-width: 2; }
      .h { font: 700 17px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .t { font: 13px 'Segoe UI', Arial, sans-serif; fill: #1f2937; }
      .a { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <text x="600" y="44" text-anchor="middle" class="title">Spark Runtime Architecture Flow</text>

  <rect x="40" y="110" width="200" height="90" class="b" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="140" y="143" text-anchor="middle" class="h">PySpark Code</text>
  <text x="140" y="167" text-anchor="middle" class="t">ETL/Data logic</text>

  <rect x="280" y="110" width="280" height="120" class="b" fill="#dcfce7" stroke="#22c55e"/>
  <text x="420" y="143" text-anchor="middle" class="h">Submission / Job API</text>
  <text x="420" y="168" text-anchor="middle" class="t">spark-submit, Databricks Job</text>
  <text x="420" y="190" text-anchor="middle" class="t">Airflow task, EMR Step, Glue Job</text>

  <rect x="600" y="110" width="240" height="110" class="b" fill="#fee2e2" stroke="#ef4444"/>
  <text x="720" y="143" text-anchor="middle" class="h">Cluster / Platform</text>
  <text x="720" y="168" text-anchor="middle" class="t">YARN, Kubernetes,</text>
  <text x="720" y="190" text-anchor="middle" class="t">Standalone, Managed Spark</text>

  <rect x="880" y="90" width="140" height="80" class="b" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="950" y="121" text-anchor="middle" class="h">Driver</text>
  <text x="950" y="144" text-anchor="middle" class="t">Planning</text>

  <rect x="880" y="200" width="220" height="100" class="b" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="990" y="233" text-anchor="middle" class="h">Executors</text>
  <text x="990" y="256" text-anchor="middle" class="t">Tasks on partitions</text>
  <text x="990" y="278" text-anchor="middle" class="t">Distributed compute</text>

  <rect x="700" y="360" width="220" height="110" class="b" fill="#e0f2fe" stroke="#0ea5e9"/>
  <text x="810" y="393" text-anchor="middle" class="h">Storage Layer</text>
  <text x="810" y="416" text-anchor="middle" class="t">HDFS, S3, ADLS, Delta</text>
  <text x="810" y="438" text-anchor="middle" class="t">Parquet, JDBC, Kafka</text>

  <rect x="950" y="360" width="210" height="110" class="b" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="1055" y="393" text-anchor="middle" class="h">Catalog</text>
  <text x="1055" y="416" text-anchor="middle" class="t">Hive / Glue / Unity</text>
  <text x="1055" y="438" text-anchor="middle" class="t">Schema + location</text>

  <rect x="420" y="520" width="360" height="110" class="b" fill="#e2e8f0" stroke="#64748b"/>
  <text x="600" y="553" text-anchor="middle" class="h">Output and Monitoring</text>
  <text x="600" y="576" text-anchor="middle" class="t">Row counts, logs, failures, retries, alerts</text>
  <text x="600" y="598" text-anchor="middle" class="t">Operational history and rerun safety</text>

  <line x1="240" y1="155" x2="280" y2="155" class="a"/>
  <line x1="560" y1="155" x2="600" y2="155" class="a"/>
  <line x1="840" y1="145" x2="880" y2="130" class="a"/>
  <line x1="720" y1="220" x2="920" y2="220" class="a"/>
  <line x1="950" y1="170" x2="990" y2="200" class="a"/>
  <line x1="990" y1="300" x2="850" y2="360" class="a"/>
  <line x1="950" y1="170" x2="1030" y2="360" class="a"/>
  <line x1="810" y1="470" x2="650" y2="520" class="a"/>
  <line x1="1055" y1="470" x2="700" y2="520" class="a"/>
</svg>
