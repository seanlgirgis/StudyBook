# docker-compose.yml
# Database Mastery Stack — Sean Edition
# All 6 databases + Kibana
# Run from: D:\Workspace\Basics\Databases\_setup\
# Start:  docker compose up -d
# Stop:   docker compose down
# Shell:  docker exec -it <name> bash   (or sh for Alpine-based images)
# Logs:   docker compose logs -f <name>

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: de_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
      - ./volumes/postgres_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: de_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Cassandra ───────────────────────────────────────────────────────
  cassandra:
    image: cassandra:4.1
    container_name: de_cassandra
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: de_cluster
      CASSANDRA_DC: dc1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      HEAP_NEWSIZE: 128M
      MAX_HEAP_SIZE: 1G
    ports:
      - "${CASSANDRA_PORT}:9042"
    volumes:
      - ./volumes/cassandra/data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep UN"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 60s

  # ── Neo4j ────────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5
    container_name: de_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    ports:
      - "${NEO4J_HTTP_PORT}:7474"
      - "${NEO4J_BOLT_PORT}:7687"
    volumes:
      - ./volumes/neo4j/data:/data
      - ./volumes/neo4j/logs:/logs
      - ./volumes/neo4j/import:/var/lib/neo4j/import
      - ./volumes/neo4j/plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── InfluxDB ─────────────────────────────────────────────────────────
  influxdb:
    image: influxdb:2.7
    container_name: de_influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    ports:
      - "${INFLUXDB_PORT}:8086"
    volumes:
      - ./volumes/influxdb/data:/var/lib/influxdb2
      - ./volumes/influxdb/config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Elasticsearch ────────────────────────────────────────────────────
  elasticsearch:
    image: elasticsearch:8.12.0
    container_name: de_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx1g
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "${ELASTIC_PORT}:9200"
    volumes:
      - ./volumes/elasticsearch/data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -v red"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Kibana ────────────────────────────────────────────────────────────
  kibana:
    image: kibana:8.12.0
    container_name: de_kibana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD}
    ports:
      - "${KIBANA_PORT}:5601"
    volumes:
      - ./volumes/kibana:/usr/share/kibana/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -v red"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── Splunk ────────────────────────────────────────────────────────────
  splunk:
    image: splunk/splunk:latest
    container_name: de_splunk
    restart: unless-stopped
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD}
    ports:
      - "${SPLUNK_PORT_WEB}:8000"
      - "${SPLUNK_PORT_HEC}:8088"
      - "${SPLUNK_PORT_MGT}:8089"
    volumes:
      - ./volumes/splunk/etc:/opt/splunk/etc
      - ./volumes/splunk/var:/opt/splunk/var
    healthcheck:
      test: ["CMD-SHELL", "curl -k -s -f https://localhost:8089/services/server/info || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

# ── named volumes not needed — all bind-mounted to D drive ──────────────
networks:
  default:
    name: de_network
