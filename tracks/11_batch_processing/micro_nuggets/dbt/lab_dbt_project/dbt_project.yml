name: 'dbt_lab'
version: '1.0.0'
config-version: 2

# Profile must match a key in profiles.yml
# profiles.yml is auto-generated by _dbt_lane_connect.py
profile: 'dbt_lab'

# Path configuration — where dbt looks for things
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Generated artifacts go here (gitignored)
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# ── Model configurations ──────────────────────────────────────────────────────
# Per-folder materialization defaults.
# Individual models can override with {{ config(...) }} block.
models:
  dbt_lab:
    # Staging: views — lightweight, just clean+rename raw data
    staging:
      +materialized: view
      +schema: staging

    # Marts: permanent tables and incremental events table
    marts:
      dim_customers:
        +materialized: table
        +tags: ["daily", "mart"]
      fct_orders:
        +materialized: table
        +tags: ["daily", "mart"]
      fct_events_incremental:
        +materialized: incremental
        +unique_key: event_id
        +on_schema_change: "append_new_columns"
        +tags: ["hourly", "mart"]

    # Intermediate: ephemeral — never materialized in DB
    # Acts as a CTE injected into downstream models
    intermediate:
      +materialized: ephemeral

    # Medallion architecture layers
    bronze:
      +materialized: view
      +schema: bronze
      +tags: ["bronze"]

    silver:
      +materialized: table
      +schema: silver
      +tags: ["silver"]

    gold:
      +materialized: table
      +schema: gold
      +tags: ["gold"]

# ── Seed configurations ───────────────────────────────────────────────────────
seeds:
  dbt_lab:
    # Seeds land in the 'raw' schema suffix → dbt_lab_raw
    +schema: raw

# ── Snapshot configurations ───────────────────────────────────────────────────
snapshots:
  dbt_lab:
    +target_schema: snapshots
