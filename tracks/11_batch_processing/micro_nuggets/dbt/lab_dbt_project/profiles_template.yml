# profiles_template.yml — Non-secret template for ALL supported backends.
# This file is safe to commit to git (no credentials).
#
# The ACTUAL profiles.yml (with credentials) is generated by:
#   python _dbt_lane_connect.py  (or any nugget script that calls write_profiles_yml())
# It is written to lab_dbt_project/profiles.yml and should NOT be committed.
#
# Add lab_dbt_project/profiles.yml to .gitignore:
#   echo "tracks/11_batch_processing/micro_nuggets/dbt/lab_dbt_project/profiles.yml" >> .gitignore

# ── DuckDB (default local fallback) ──────────────────────────────────────────
dbt_lab:
  target: dev
  outputs:
    dev:
      type: duckdb
      # Path to local DuckDB file. All schemas live inside this file.
      path: "lab_dbt.duckdb"
      schema: dbt_lab
      threads: 4

