services:
  postgres:
    image: postgres:16
    container_name: obs_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: observability
      POSTGRES_USER: obs_user
      POSTGRES_PASSWORD: obs_pass
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obs_user -d observability"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pg_data:
